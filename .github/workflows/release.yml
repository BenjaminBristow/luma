cd ~/luma

cat > .github/workflows/release.yml <<'EOF'
name: Release Luma

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run tests
        run: pytest

  build-macos:
    name: Build macOS application
    runs-on: macos-15
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build versioned Luma.app
        env:
          LUMA_VERSION: ${{ github.ref_name }}
        run: |
          export LUMA_VERSION="${LUMA_VERSION#v}"
          echo "Building Luma ${LUMA_VERSION}"
          pyinstaller --clean --noconfirm Luma.spec
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            dist/Luma.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            dist/Luma.app/Contents/Info.plist)" = "$LUMA_VERSION"

      - name: Create DMG installer
        run: |
          mkdir dmg
          cp -R dist/Luma.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create \
            -volname "Luma" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            Luma.dmg

      - name: Create ZIP download
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Luma.app Luma-macOS.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: Luma-macOS
          path: |
            Luma.dmg
            Luma-macOS.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: Luma-macOS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Luma.dmg
            Luma-macOS.zip
          generate_release_notes: true
