name: Release Luma

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run tests
        run: pytest

  build-macos:
    name: Build macOS application
    runs-on: macos-15
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Luma.app
        run: |
          pyinstaller \
            --clean \
            --windowed \
            --name Luma \
            --osx-bundle-identifier com.benjaminbristow.luma \
            src/luma/gui.py

      - name: Create DMG staging folder
        run: |
          mkdir dmg
          cp -R dist/Luma.app dmg/
          ln -s /Applications dmg/Applications

      - name: Build Luma.dmg
        run: |
          hdiutil create \
            -volname "Luma" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            Luma.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Luma-macOS
          path: Luma.dmg

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Luma-macOS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Luma.dmg
          generate_release_notes: true