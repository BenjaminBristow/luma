[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma"
version = "2.0.0"
description = "A batch image editor with professional presets"
requires-python = ">=3.12"
dependencies = [
    "Pillow",
    "numpy",
    "tqdm",
    "customtkinter",
    "tkinterdnd2",
]

[project.scripts]
luma = "luma.gui:main"
luma-cli = "luma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]