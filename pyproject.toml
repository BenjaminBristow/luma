[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-image-editor"
version = "2.0.0"
description = "A Python batch photo editor with a modern GUI and command-line interface"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Benjamin Bristow"}
]
dependencies = [
    "Pillow",
    "numpy",
    "tqdm",
    "pywebview",
]

[project.urls]
Homepage = "https://github.com/BenjaminBristow/luma"
Repository = "https://github.com/BenjaminBristow/luma"
Issues = "https://github.com/BenjaminBristow/luma/issues"

[project.scripts]
luma = "luma.app.main:main"
luma-cli = "luma.cli:main"
luma-app = "luma.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"luma.app" = [
    "web/index.html",
    "web/css/*.css",
    "web/js/*.js",
]