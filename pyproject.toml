[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-image-editor"
version = "1.2.0"
description = "A command-line batch image editor with professional presets"
requires-python = ">=3.12"
dependencies = [
    "Pillow",
    "numpy",
    "pytest",
]

[project.scripts]
luma = "luma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]