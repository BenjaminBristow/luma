[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-image-editor"
version = "2.0.0"
description = "A Python batch photo editor with a modern GUI and command-line interface"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Benjamin Bristow"}
]
dependencies = [
    "Pillow",
    "numpy",
    "tqdm",
    "customtkinter",
    "tkinterdnd2",
]

[project.urls]
Homepage = "https://github.com/BenjaminBristow/luma"
Repository = "https://github.com/BenjaminBristow/luma"
Issues = "https://github.com/BenjaminBristow/luma/issues"

[project.scripts]
luma = "luma.gui:main"
luma-cli = "luma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]